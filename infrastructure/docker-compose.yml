# Local-only data services. Host ports are intentionally project-specific so
# CampusConnect never attaches to another repository's Postgres or Redis.
services:
  postgres:
    image: postgres:15-alpine
    container_name: cmc_network_postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_connect_dev}
      POSTGRES_DB: ${POSTGRES_DB:-campus_connect}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_connect} -d ${POSTGRES_DB:-campus_connect}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cmc_network_redis_dev
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
