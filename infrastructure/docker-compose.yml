version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campus_connect_db
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_password
      POSTGRES_DB: campus_connect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campus_connect_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
